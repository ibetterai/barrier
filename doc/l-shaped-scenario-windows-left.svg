<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 610" role="img" aria-labelledby="title desc">
  <title id="title">Four-machine L-shaped Barrier layout with Windows client on the left</title>
  <desc id="desc">The macOS client landscape display is a 1920 by 1080 rectangle above the server landscape display. A Windows client display is a 3240 by 2160 rectangle on the left of the server landscape display. The server portrait display is a 1080 by 1920 tall rectangle on the right, adjacent to both landscape displays on its left.</desc>
  <defs>
    <style>
      .canvas { fill: #0f172a; }
      .display { stroke: #082f49; stroke-width: 3; rx: 10; ry: 10; }
      .empty { fill: #1e293b; stroke: #334155; stroke-width: 2; stroke-dasharray: 8 8; rx: 10; ry: 10; }
      .mac { fill: #f8fafc; }
      .windows { fill: #dcfce7; }
      .server { fill: #38bdf8; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .emptyText { fill: #94a3b8; }
      .label { font-size: 18px; font-weight: 700; }
      .detail { font-size: 14px; }
      .edge { stroke: #f97316; stroke-width: 5; stroke-linecap: round; }
      .note { fill: #e2e8f0; font-size: 13px; }
    </style>
  </defs>
  <rect class="canvas" width="1080" height="610"/>
  <rect class="empty" x="40" y="40" width="518.4" height="172.8"/>
  <rect class="display mac" x="558.4" y="40" width="307.2" height="172.8"/>
  <rect class="display windows" x="40" y="212.8" width="518.4" height="345.6"/>
  <rect class="display server" x="558.4" y="212.8" width="307.2" height="172.8"/>
  <rect class="display server" x="865.6" y="40" width="172.8" height="307.2"/>
  <line class="edge" x1="865.6" y1="40" x2="865.6" y2="347.2"/>
  <text class="text emptyText detail" x="299.2" y="132">no display</text>
  <text class="text label" x="712" y="108">macOS client</text>
  <text class="text detail" x="712" y="132">1920×1080 landscape</text>
  <text class="text detail" x="712" y="154">top, in notch</text>
  <text class="text label" x="299.2" y="353">Windows client</text>
  <text class="text detail" x="299.2" y="377">3240×2160</text>
  <text class="text detail" x="299.2" y="399">left of server</text>
  <text class="text label" x="712" y="281">Server</text>
  <text class="text detail" x="712" y="305">1920×1080 landscape</text>
  <text class="text detail" x="712" y="327">bottom</text>
  <text class="text label" x="952" y="164">Server</text>
  <text class="text detail" x="952" y="188">1080×1920</text>
  <text class="text detail" x="952" y="210">portrait</text>
  <text class="text detail" x="952" y="232">right</text>
  <text class="text note" x="540" y="590">Boxes are proportional: 3240×2160 Windows, 1920×1080 landscape, 1080×1920 portrait.</text>
</svg>
