name: Public audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.30.1 \
            --repo gitleaks/gitleaks \
            --pattern 'gitleaks_8.30.1_linux_x64.tar.gz' \
            --output /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Test protected-metadata audit
        run: |
          bash scripts/tests/scan-protected-metadata_test.sh
          bash scripts/tests/public-audit_test.sh
      - run: bash scripts/public-audit.sh
